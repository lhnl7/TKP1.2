name: Build IPA (Archive & Manual Export - No Signing)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Archive (no signing)
        run: |
          set -o pipefail
          xcodebuild -project tkp.xcodeproj -scheme tkp -configuration Release -sdk iphoneos -archivePath build/tkp.xcarchive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" archive | tee xcodebuild.log

      - name: Debug - list build folder
        run: |
          echo "=== BUILD DIR ==="
          ls -la build || true
          echo "=== XCARCHIVE CONTENTS ==="
          ls -la build/tkp.xcarchive || true
          echo "=== PRODUCTS ==="
          ls -la build/tkp.xcarchive/Products || true
          echo "=== APPLICATIONS ==="
          ls -la build/tkp.xcarchive/Products/Applications || true
          echo "=== END ==="

      - name: Export IPA manually
        run: |
          set -e
          APP_PATH="build/tkp.xcarchive/Products/Applications/tkp.app"
          echo "App path: $APP_PATH"
          mkdir -p export/Payload
          cp -R "$APP_PATH" export/Payload/
          cd export
          zip -r tkp.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: tkp-ipa
          path: export/tkp.ipa
